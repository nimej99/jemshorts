<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="젬쇼츠 영상에서 소개한 제품과 구매 정보를 확인하세요.">
  <title>젬쇼츠 추천 제품</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header class="hero">
      <div class="logo">J</div>
      <div>
        <h1>젬쇼츠 추천 제품</h1>
        <p>영상에서 소개한 제품을 한곳에 모았습니다.</p>
      </div>
    </header>

    <aside class="disclosure" aria-label="광고 고지">
      <strong>[광고]</strong> 이 페이지는 쿠팡 파트너스 활동의 일환으로,
      이에 따른 일정액의 수수료를 제공받습니다.
    </aside>

    <section id="products" class="products" aria-live="polite"></section>
    <p id="empty" class="empty" hidden>현재 공개된 추천 제품이 없습니다.</p>

    <footer>
      가격과 재고는 판매처에서 변경될 수 있습니다. 구매 전 최종 정보를 확인하세요.
    </footer>
  </main>
  <template id="product-template">
    <article class="card">
      <img class="product-image" alt="" loading="lazy" referrerpolicy="no-referrer">
      <div class="content">
        <div class="badges"></div>
        <a class="details"><h2></h2></a>
        <p class="summary"></p>
        <p class="price"></p>
        <div class="actions">
          <div class="offer-actions"></div>
          <a class="watch" rel="noopener" target="_blank">소개 쇼츠 보기</a>
        </div>
        <p class="updated"></p>
      </div>
    </article>
  </template>
  <script src="app.js" defer></script>
</body>
</html>
