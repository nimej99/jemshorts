name: Deploy product hub

on:
  push:
    branches: [v1-dev]
    paths:
      - "product-hub/**"
      - ".github/workflows/product-hub-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: product-hub-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: product-hub
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
